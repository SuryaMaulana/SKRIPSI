[project]
name = "skripsi-weblog-attack"
version = "0.1.0"
description = "Deteksi dan klasifikasi serangan aplikasi web pada log akses web server (SR-BH 2020): data, pembanding, deep agent."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # langkah E (deep agent); versi persis terkunci di requirements.txt
    "deepagents>=0.7.22,<0.8",
    "langchain>=1.4.3,<2",
    "langchain-openai>=1.6.7,<2",
    "langgraph>=1.2.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not slow'"
markers = ["slow: uji lambat yang memakai data penuh (make test-slow)"]
